services:

  redis:
    image: redis:8.2-alpine
    restart: always
    command: [ "redis-server", "--appendonly", "yes" ]
    networks:
      - appnet
    volumes:
      - ./redis_data:/data

  celery-worker:
    build:
      context: ./tiny-pulse-backend
    command: [ "/app/.venv/bin/celery", "-A", "app.celery_app", "worker", "--loglevel=info" ]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-tiny-pulse}
      DB_NAME: ${POSTGRES_DB:-tiny-pulse}
      DB_POOL_SIZE: 10
      DB_MAX_OVERFLOW: 20
      REDIS_URL: redis://redis:6379/0
    secrets:
      - db-password
    networks:
      - appnet
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build:
      context: ./tiny-pulse-backend
    command: [ "/app/.venv/bin/celery", "-A", "app.celery_app", "beat", "--loglevel=info" ]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-tiny-pulse}
      DB_NAME: ${POSTGRES_DB:-tiny-pulse}
      DB_POOL_SIZE: 10
      DB_MAX_OVERFLOW: 20
      REDIS_URL: redis://redis:6379/0
    secrets:
      - db-password
    networks:
      - appnet
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./tiny-pulse-frontend
    networks:
      - appnet
    ports:
      - "4000:80"
    depends_on:
      - backend
  backend:
    build:
      context: ./tiny-pulse-backend

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-tiny-pulse}
      DB_NAME: ${POSTGRES_DB:-tiny-pulse}
      DB_POOL_SIZE: 10
      DB_MAX_OVERFLOW: 20
    secrets:
      - db-password
    networks:
      - appnet
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tiny-pulse}
      POSTGRES_DB: ${POSTGRES_DB:-tiny-pulse}
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    secrets:
      - db-password
    networks:
      - appnet
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-default_user} -d $${POSTGRES_DB:-default_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

secrets:
  db-password:
    file: ./secrets/db-password.txt

networks:
  appnet:
    name: appnet

volumes:
  pg_data:
  redis_data: